name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            zip

      - name: Build tomlang.exe
        run: bash build.sh

      - name: Check it runs
        run: |
          printf 'set total = 0\nrepeat each i in 1..10\n    total += i\nend\nsay "TomLang works: {total}"\n' > hello.tom
          ./build/tomlang.exe hello.tom

      - name: Package
        run: |
          mkdir -p dist/TomLang
          cp build/tomlang.exe dist/TomLang/
          cp -r lib dist/TomLang/
          cp assets/tomlang.ico dist/TomLang/
          cp tools/install.ps1 dist/TomLang/
          cp Extensions/*.vsix dist/TomLang/ 2>/dev/null || true
          cp README.md dist/TomLang/
          cd dist && zip -qr TomLang-windows-x64.zip TomLang

      - uses: actions/upload-artifact@v4
        with:
          name: TomLang-windows-x64
          path: dist/TomLang

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TomLang-windows-x64.zip
          generate_release_notes: true
